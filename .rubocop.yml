# Starter config. Cops disabled by default; opt in deliberately as the gem's
# style conventions get established. Most code in this repo is generated by
# OpenAPI Generator (https://github.com/embedworkflow/sdk-generator), so any
# cops enabled here should be ones the generator's output can satisfy — or
# the relevant files should be excluded.
AllCops:
  DisabledByDefault: true
  NewCops: disable
  TargetRubyVersion: 2.6.8
  Exclude:
    - '**/vendor/**/*'
